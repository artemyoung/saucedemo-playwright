name: Playwright Tests

on:
  # Будь-який push у будь-яку гілку
  push:
  # Ручний запуск з вкладки Actions
  workflow_dispatch:

# Новий push у ту саму гілку скасовує попередній незавершений прогін
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests (UI + API)
        run: npm test

      # HTML-звіт: завантажити архів з Actions → Artifacts, розпакувати, `npx playwright show-report <папка>`
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Трейси, скріншоти й error-context лише для впалих тестів
      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
